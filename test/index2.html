<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Panels Site</title>
	<style>
		body, html {
			margin: 0;
			padding: 0;
			font-family: sans-serif;
			height: 100%;
			overflow: hidden; /* This is key to hiding extra panels */
		}

		.panels-container {
			height: 100vh;
			width: 100vw;
			display: flex;
			flex-direction: column;
			transition: transform 0.7s ease-in-out; /* Add smooth sliding animation */
		}

		.panel {
			height: 100%;
			width: 100%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			color: white;
			font-size: 2em;
			flex-shrink: 0; /* Prevents panels from shrinking */
		}

		.panel-one { background-color: #2c3e50; }
		.panel-two { background-color: #e74c3c; }
		.panel-three { background-color: #3498db; }

		.navigation {
			position: fixed;
			bottom: 20px;
			right: 20px;
			z-index: 100;
		}

		.navigation button {
			background-color: rgba(0, 0, 0, 0.5);
			color: white;
			border: none;
			padding: 15px;
			margin: 5px;
			cursor: pointer;
			font-size: 1.5em;
			border-radius: 5px;
		}
	</style>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="panels-container">
        <div class="panel panel-one">
            <h2>Panel One</h2>
            <p>Content for the first panel.</p>
        </div>
        <div class="panel panel-two">
            <h2>Panel Two</h2>
            <p>Content for the second panel.</p>
        </div>
        <div class="panel panel-three">
            <h2>Panel Three</h2>
            <p>Content for the third panel.</p>
        </div>
    </div>
    <div class="navigation">
        <button id="up-btn">&uarr;</button>
        <button id="down-btn">&darr;</button>
    </div>
</body>
<script>
	document.addEventListener('DOMContentLoaded', () => {
    const container = document.querySelector('.panels-container');
    const panels = document.querySelectorAll('.panel');
    const upBtn = document.getElementById('up-btn');
    const downBtn = document.getElementById('down-btn');
    
    let currentIndex = 0;
    const totalPanels = panels.length;

    // Function to update the panels' position
    const updatePanelPosition = () => {
        container.style.transform = `translateY(-${currentIndex * 100}vh)`;
    };

    // Event listener for the "down" button
    downBtn.addEventListener('click', () => {
        if (currentIndex < totalPanels - 1) {
            currentIndex++;
            updatePanelPosition();
        }
    });

    // Event listener for the "up" button
    upBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            updatePanelPosition();
        }
    });

    // Optional: Add keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') {
            upBtn.click();
        } else if (e.key === 'ArrowDown') {
            downBtn.click();
        }
    });
});

</script>
</html>
