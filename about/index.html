	<title>About - lazergenix.dev</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/firacode@6.2.0/distr/fira_code.css">
	<style>
		:root {
			--corner-offset: 8px;
			color-scheme: light dark;
			--fg: light-dark(#000, #FFF);
			--bg: light-dark(#FFF, #000);
			--light: light-dark(#BBB, #222);
		}
		.light {
			color-scheme: only light;
		}
		.dark {
			color-scheme: only dark;
		}
		
		body {
			background-color: black;
			color: #FFF;
			margin: 0;
			font-family: 'Fira Code', monospace;
			font-optical-sizing: auto;
			font-weight: 400;
			font-style: normal;
		}

		header {
			text-align: center;
		}
		
		main {
			max-width: 600px;
			margin: 40px auto 0 auto;
			padding: 0 1rem;
		}

		#topbar {
			display: flex;
			gap: 1em;
			justify-content: center;
		}

		a {
			color: white;
		}

		h1 a:hover {
			color: #929292;
		}

		#topbar a {
			text-decoration: none;
			position: relative;
			padding: 10px 20px;
			font-size: 16px;
			font-weight: bold;
			border: none;
			cursor: pointer;
			overflow: hidden;
		}

		#topbar a::after {
			content: "";
			background: white;
			/* Bar color */
			position: absolute;
			bottom: 0;
			left: 0;
			height: 3px;
			/* Bar thickness */
			width: 0%;
			transition: width 0.3s ease;
		}

		#topbar a:hover::after {
			width: 100%;
		}
		
		#links {
			display: flex;
			gap: 18px;
		}

		#links a {
			background-color: var(--bg);
			border-radius: 24px;
			width:  48px;
			height: 48px;
			display: flex;
			justify-content: center;
			align-items: center;
			transition: all 0.2s ease;
		}

		#links a:hover {
			background-color: var(--fg);
			color: var(--bg);
		}

		svg {
			fill: currentColor;
			width: 32px;
			height: 32px;
		}

		#resume {
			margin: 0;
			
			h1 {
				margin: 0;
			}
		}

		#resume a {
			display: flex;
			align-items: center;
			gap: 18px;
		}

		section {
			padding: 1em;
		}

		section h1 {
			font-size: xx-large;
			background-color: #FFF;
			color: #000;
			width: fit-content;
			padding: 0 8px 0 8px;
		}

		footer {
			color: gray;
			text-align: center;
			margin-top: 100px;
			margin-bottom: 10px;
		}
	</style>
</head>
